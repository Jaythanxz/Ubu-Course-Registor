services:
  - type: web
    name: ubu-registration
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # If you connect Render PostgreSQL Database, uncomment below:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: ubu-postgres-db
      #     property: connectionString

# Optional: Uncomment if you want Render to automatically spin up a free PostgreSQL database
# databases:
#   - name: ubu-postgres-db
#     plan: free
#     databaseName: ubu_registration
#     user: ubu_admin
