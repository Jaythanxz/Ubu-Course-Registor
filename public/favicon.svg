<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: UBU Emerald to Deep Midnight Teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897B"/>
      <stop offset="45%" stop-color="#006663"/>
      <stop offset="100%" stop-color="#003D3A"/>
    </linearGradient>
    
    <!-- Gold / Orange Tassel Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="40%" stop-color="#F07C00"/>
      <stop offset="100%" stop-color="#C25E00"/>
    </linearGradient>

    <!-- Cap Highlights -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Academic Graduation Cap (Mortarboard) -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond Top -->
    <polygon points="64,20 112,42 64,64 16,42" fill="url(#capGrad)"/>
    
    <!-- Cap Lower Skullcap -->
    <path d="M34,52 L34,71 C34,80 94,80 94,71 L94,52 C85,58 75,61 64,61 C53,61 43,58 34,52 Z" fill="#CBD5E1"/>

    <!-- Gold Center Button -->
    <circle cx="64" cy="42" r="5" fill="url(#goldGrad)"/>

    <!-- Tassel Ribbon & Bob -->
    <path d="M64,42 Q88,44 96,56 Q101,66 100,77" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="80" r="4.5" fill="url(#goldGrad)"/>
    <polygon points="96,81 104,81 106,94 94,94" fill="url(#goldGrad)"/>
  </g>

  <!-- Open Academic Book Beneath -->
  <g filter="url(#shadow)">
    <!-- Book Left Page -->
    <path d="M64,88 C54,82 38,82 24,85 C23,85 22,86 22,87 L22,104 C22,105 23,106 24,106 C38,103 54,104 64,110 Z" fill="#FFFFFF"/>
    <!-- Book Right Page -->
    <path d="M64,88 C74,82 90,82 104,85 C105,85 106,86 106,87 L106,104 C106,105 105,106 104,106 C90,103 74,104 64,110 Z" fill="#F1F5F9"/>
    <!-- Book Center Seam -->
    <line x1="64" y1="88" x2="64" y2="110" stroke="#003D3A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Page lines left -->
    <line x1="30" y1="92" x2="56" y2="90" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="98" x2="54" y2="96" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Page lines right -->
    <line x1="72" y1="90" x2="98" y2="92" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="74" y1="96" x2="98" y2="98" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>